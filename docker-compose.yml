version: "3"
services:
    web:
        build: ./backend
        command: python3 manage.py runserver 0.0.0.0:8000
        volumes:
            - static_data:/app/static
            - media_data:/app/media
            - model_data:/app/accounts_face_recognition/model_data 
            - ./backend:/app
        ports:
            - 8000:8000
        env_file:
            - ./.env.dev
        depends_on:
            - db

    db:
        image: postgres:13-alpine
        restart: always
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: database


volumes:
    static_data:
    media_data:
    model_data:
    postgres_data:
